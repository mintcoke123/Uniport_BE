# 로컬 전용 오버라이드. 시크릿은 env 로만 설정 (KIS_APPKEY_2, KIS_APPSECRET_2).
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
kis:
  api:
    # appkey/appsecret 은 application.yaml 에서 ${KIS_APPKEY_2:}, ${KIS_APPSECRET_2:} 로 로드.
    # 로컬에서 사용 시 환경 변수 또는 .env 에 설정.
    use-mock: false

backtest:
  price-fallback:
    # 실제 백테스트 기본값은 실가격만 사용한다. 로컬 UI 흐름 데모가 필요할 때만 env 로 true 를 명시한다.
    enabled: ${BACKTEST_PRICE_FALLBACK_ENABLED:false}

uniport:
  investment-issue:
    public-web:
      enabled: ${UNIPORT_PUBLIC_WEB_ISSUES_ENABLED:true}
