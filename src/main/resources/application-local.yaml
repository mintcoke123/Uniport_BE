# local overrides
# KIS keys must come from environment variables only.
# festival policy: do not use k2. configure only k1, k3, k4.
spring:
  h2:
    console:
      enabled: true
      path: /h2-console

kis:
  api:
    # application.yaml loads k1 as the default key and k1/k3/k4 for the multi-key pool.
    use-mock: false
