# 로컬 전용 오버라이드. KIS 자격 증명과 고정 접근 토큰은 env 로만 설정.
spring:
  h2:
    console:
      enabled: true
      path: /h2-console
kis:
  api:
    # appkey/appsecret/access-token 은 application.yaml 에서 KIS_API_* 환경 변수로 로드.
    # 로컬에서 사용 시 환경 변수 또는 .env 에 설정.
    use-mock: false

backtest:
  price-fallback:
    # 실제 백테스트 기본값은 실가격만 사용한다. 로컬 UI 흐름 데모가 필요할 때만 env 로 true 를 명시한다.
    enabled: ${BACKTEST_PRICE_FALLBACK_ENABLED:false}

uniport:
  investment-issue:
    public-web:
      enabled: ${UNIPORT_PUBLIC_WEB_ISSUES_ENABLED:true}
