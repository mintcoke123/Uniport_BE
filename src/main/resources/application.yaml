server:
  port: ${PORT:8080}

spring:
  application:
    name: uniport

  datasource:
    # env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD. driver/dialect는 URL 기준 자동 선택.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

# 로깅 (SQL 가독성)
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# CORS (env: APP_CORS_ALLOWED_ORIGINS. 프로덕션에서는 허용 오리진 제한)
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:${APP_FRIEND_INVITE_BASE_URL:https://uniportbe-production.up.railway.app}}
  beta:
    admin-token: ${APP_BETA_ADMIN_TOKEN:}
    android-invite-url: ${APP_BETA_ANDROID_INVITE_URL:}
    contact-email: ${APP_BETA_CONTACT_EMAIL:kwakkun2002@gmail.com}
    ios:
      app-store-connect:
        enabled: ${APPSTORE_CONNECT_INVITE_ENABLED:false}
        issuer-id: ${APPSTORE_CONNECT_ISSUER_ID:}
        key-id: ${APPSTORE_CONNECT_KEY_ID:}
        private-key: ${APPSTORE_CONNECT_PRIVATE_KEY:}
        app-id: ${APPSTORE_CONNECT_APP_ID:}
        invite-role: ${APPSTORE_CONNECT_INVITE_ROLE:MARKETING}
        group-sync-fixed-delay-ms: ${APPSTORE_CONNECT_GROUP_SYNC_FIXED_DELAY_MS:60000}
        internal-beta-group-id: ${APPSTORE_CONNECT_INTERNAL_BETA_GROUP_ID:}
        internal-beta-group-name: ${APPSTORE_CONNECT_INTERNAL_BETA_GROUP_NAME:uniport tester}
        base-url: ${APPSTORE_CONNECT_BASE_URL:https://api.appstoreconnect.apple.com}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  friend-invite:
    base-url: ${APP_FRIEND_INVITE_BASE_URL:https://uniportbe-production.up.railway.app}
    expiration-days: ${APP_FRIEND_INVITE_EXPIRATION_DAYS:7}

# JWT (env: JWT_SECRET 필수 권장. 프로덕션에서는 반드시 32자 이상 랜덤 값 설정)
jwt:
  secret: ${JWT_SECRET:uniport-jwt-secret-key-change-in-production-min-256bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24시간

# Firebase Authentication
firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

# KIS Open API 단일 키 운영. 시크릿과 고정 접근 토큰은 환경 변수로만 주입한다.
kis:
  api:
    base-url: ${KIS_API_BASE_URL:https://openapi.koreainvestment.com:9443}
    base-url-mock: ${KIS_API_BASE_URL_MOCK:https://openapivts.koreainvestment.com:29443}
    appkey: ${KIS_API_APPKEY:}
    appsecret: ${KIS_API_APPSECRET:}
    access-token: ${KIS_API_ACCESS_TOKEN:}
    use-mock: ${KIS_API_USE_MOCK:false}
  # 멀티키 운영 비활성화. kis.keys 목록을 설정하지 않고 kis.api 단일 키만 사용한다.
  # keys:
  #   - id: secondary
  #     appkey: ${KIS_SECONDARY_APPKEY:}
  #     appsecret: ${KIS_SECONDARY_APPSECRET:}

backtest:
  fx:
    usd-krw-rate: ${BACKTEST_USD_KRW_RATE:0}
  price-fallback:
    enabled: ${BACKTEST_PRICE_FALLBACK_ENABLED:false}

openai:
  api-key: ${OPENAI_API_KEY:${AI_PROVIDER_API_KEY:}}
  base-url: ${OPENAI_BASE_URL:${AI_LLM_ENDPOINT:https://api.openai.com}}
  model: ${OPENAI_MODEL:gpt-4.1}
  feedback:
    enabled: ${OPENAI_FEEDBACK_ENABLED:true}

naver:
  news:
    enabled: ${NAVER_NEWS_ENABLED:false}
    client-id: ${NAVER_NEWS_CLIENT_ID:}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET:}
    cache-ttl-seconds: ${NAVER_NEWS_CACHE_TTL_SECONDS:300}
    display-per-query: ${NAVER_NEWS_DISPLAY_PER_QUERY:30}
    queries:
      market:
        - "코스피 코스닥 환율 금리 외국인 기관"
        - "증시 시황 FOMC 금리 환율"
      theme:
        - "반도체 HBM AI 데이터센터"
        - "2차전지 배터리 전기차 리튬"
        - "방산 원전 로봇 바이오"
      company:
        - "국내증시 실적 영업이익 어닝"
        - "수주 공급계약 공시 자사주"
      overseas:
        - "미국증시 나스닥 빅테크 AI"
        - "엔비디아 테슬라 애플 마이크로소프트"

finbert:
  sentiment:
    enabled: ${FINBERT_SENTIMENT_ENABLED:false}
    base-url: ${FINBERT_SENTIMENT_BASE_URL:http://localhost:8011}
    min-confidence: ${FINBERT_SENTIMENT_MIN_CONFIDENCE:0.60}

# 종목 마스터 매일 자동 갱신 (Postgres advisory lock 사용, 다중 인스턴스 중 1개만 실행)
stock:
  master:
    import:
      enabled: ${STOCK_MASTER_IMPORT_ENABLED:false}
      cron: ${STOCK_MASTER_IMPORT_CRON:0 30 7 * * *}
      zone: ${STOCK_MASTER_IMPORT_ZONE:Asia/Seoul}

asset:
  master:
    us:
      import:
        enabled: ${US_ASSET_MASTER_IMPORT_ENABLED:false}
        cron: ${US_ASSET_MASTER_IMPORT_CRON:0 45 7 * * *}
        zone: ${US_ASSET_MASTER_IMPORT_ZONE:Asia/Seoul}
        nasdaq-listed-url: ${US_ASSET_MASTER_NASDAQ_LISTED_URL:https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt}
        other-listed-url: ${US_ASSET_MASTER_OTHER_LISTED_URL:https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt}

# 시드/어드민 (env: UNIPORT_ADMIN_*, UNIPORT_SISU_ADMIN_*, UNIPORT_SEED_TEST_USER_ENABLED)
uniport:
  admin:
    student-id: ${UNIPORT_ADMIN_STUDENT_ID:22011739}
    password: ${UNIPORT_ADMIN_PASSWORD:uniport}
  sisu-admin:
    student-id: ${UNIPORT_SISU_ADMIN_STUDENT_ID:26999999}
    password: ${UNIPORT_SISU_ADMIN_PASSWORD:SISUadmin123!!}
  seed:
    test-user-enabled: ${UNIPORT_SEED_TEST_USER_ENABLED:true}
  investment-issue:
    enabled: true
    cache-ttl-seconds: 300
    refresh:
      enabled: ${UNIPORT_INVESTMENT_ISSUE_REFRESH_ENABLED:true}
      fixed-delay-ms: ${UNIPORT_INVESTMENT_ISSUE_REFRESH_DELAY_MS:300000}
      initial-delay-ms: ${UNIPORT_INVESTMENT_ISSUE_REFRESH_INITIAL_DELAY_MS:30000}
    public-web:
      enabled: ${UNIPORT_PUBLIC_WEB_ISSUES_ENABLED:true}
      timeout-ms: ${UNIPORT_PUBLIC_WEB_ISSUES_TIMEOUT_MS:6000}
      # Only configure public pages that are allowed for automated access.
      sources:
        - name: SaveTicker News
          url: https://www.saveticker.com/news
          category: MARKET
          source-name: 세이브티커
          max-items: 40
    # Reserved for future IssueClusterService tuning; display limits below are actively bound.
    cluster:
      time-window-hours: 24
      min-similarity: 0.62
      max-articles-per-issue: 8
      min-articles-per-issue: 1
    display:
      max-reason-bullets: 3
      max-watch-points: 2
      max-related-stocks: 5
      max-related-etfs: 3
  education:
    seed:
      force-refresh: ${UNIPORT_EDUCATION_SEED_FORCE_REFRESH:false}
    assets:
      bucket:
        endpoint: ${UNIPORT_EDU_BUCKET_ENDPOINT:}
        name: ${UNIPORT_EDU_BUCKET_NAME:}
        access-key-id: ${UNIPORT_EDU_BUCKET_ACCESS_KEY_ID:}
        secret-access-key: ${UNIPORT_EDU_BUCKET_SECRET_ACCESS_KEY:}
        session-token: ${UNIPORT_EDU_BUCKET_SESSION_TOKEN:}
        region: ${UNIPORT_EDU_BUCKET_REGION:auto}
        url-style: ${UNIPORT_EDU_BUCKET_URL_STYLE:virtual-host}
        presign-ttl-seconds: ${UNIPORT_EDU_BUCKET_PRESIGN_TTL_SECONDS:3600}
